name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dorongan baru ke cabang yang sama membatalkan jalan sebelumnya: hasil dari
# commit yang sudah tertimpa tidak ada gunanya ditunggu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nilai NEXT_PUBLIC_ ditanam saat build. Tanpa berkas ini build tetap
      # berhasil tapi menghasilkan URL kosong, dan aplikasinya gagal senyap.
      # Menyalin dari .env.example sekaligus menjaga berkas itu tetap sahih.
      - run: cp .env.example .env.local

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: cp .env.example .env.local

      - run: npx playwright install --with-deps chromium

      # Hanya satu peramban di CI, bukan keenamnya. Test menembak PokeAPI
      # sungguhan, dan enam kali beban itu dari alamat CI bersama mengundang
      # kegagalan yang tidak ada hubungannya dengan perubahan kodenya.
      # Cakupan lintas perangkat tetap dijalankan penuh di mesin lokal.
      - run: npx playwright test --project=desktop-chrome

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
